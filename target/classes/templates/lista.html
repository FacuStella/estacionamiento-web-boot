<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragmentos :: cabecera(${ent.titulo()})}"></head>
<body class="bg-light">
<nav th:replace="~{fragmentos :: barra}"></nav>
<main class="container pb-5">
    <div th:replace="~{fragmentos :: avisos}"></div>

    <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
        <h1 class="h3 me-auto mb-0" th:text="${ent.titulo()}">Titulo</h1>
        <form method="get" class="d-flex gap-2" th:action="@{/admin/{e}(e=${ent.id()})}">
            <input type="search" name="q" th:value="${q}" class="form-control" placeholder="Buscar" aria-label="Buscar">
            <button class="btn btn-outline-secondary">Buscar</button>
        </form>
        <a class="btn btn-success" th:href="@{/admin/{e}/nuevo(e=${ent.id()})}" th:text="${ent.nuevo()}">Nuevo</a>
    </div>

    <p th:if="${filas.isEmpty()}" class="alert alert-secondary">No hay registros para mostrar.</p>
    <div th:unless="${filas.isEmpty()}" class="table-responsive">
        <table class="table table-hover align-middle bg-white border">
            <thead class="table-light">
                <tr>
                    <th th:each="c : ${ent.columnas()}" th:text="${c.titulo()}">Columna</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="f : ${filas}">
                    <td th:each="x : ${f.celdas()}" th:text="${x}" class="text-nowrap">dato</td>
                    <td>
                        <div class="d-flex flex-wrap gap-1 justify-content-end">
                            <a class="btn btn-sm btn-outline-primary"
                               th:href="@{/admin/{e}/{c}/editar(e=${ent.id()},c=${f.clave()})}">Editar</a>
                            <a th:each="a : ${ent.acciones()}" class="btn btn-sm btn-outline-secondary" th:text="${a.etiqueta()}"
                               th:href="@{/admin/{e}/{c}/accion/{a}(e=${ent.id()},c=${f.clave()},a=${a.id()})}">Accion</a>
                            <a class="btn btn-sm btn-outline-danger"
                               th:href="@{/admin/{e}/{c}/accion/eliminar(e=${ent.id()},c=${f.clave()})}">Eliminar</a>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
