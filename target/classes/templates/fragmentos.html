<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:fragment="cabecera(titulo)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · Sherlock Homes'">Sherlock Homes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/playa.css}">
</head>
<body>

<nav th:fragment="barra" class="navbar navbar-dark bg-dark mb-4">
    <div class="container d-flex flex-wrap gap-2">
        <span class="navbar-brand mb-0 h1 me-3">Estacionamiento</span>
        <ul class="nav me-auto flex-wrap">
            <li class="nav-item" th:each="i : ${menu}">
                <a class="nav-link" th:href="@{${i.url()}}" th:text="${i.texto()}"
                   th:classappend="${#strings.startsWith(uri, i.url())} ? 'active text-white fw-semibold' : 'text-white-50'">Item</a>
            </li>
        </ul>
        <a th:if="${usuario != null}" class="navbar-text me-2 text-white-50" th:href="@{/cuenta/clave}"
           title="Cambiar contraseña" th:text="${usuario}">usuario</a>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button class="btn btn-outline-light btn-sm">Salir</button>
        </form>
    </div>
</nav>

<div th:fragment="avisos">
    <div th:if="${ok != null}" class="alert alert-success" role="alert" th:text="${ok}"></div>
    <div th:if="${error != null}" class="alert alert-danger" role="alert" th:text="${error}"></div>
</div>

<div th:fragment="tabla(columnas, filas)">
    <p th:if="${filas.isEmpty()}" class="alert alert-secondary">Todavía no hay registros.</p>
    <div th:unless="${filas.isEmpty()}" class="table-responsive">
        <table class="table table-hover bg-white border">
            <thead class="table-light">
                <tr><th th:each="c : ${columnas}" th:text="${c.titulo()}">Columna</th></tr>
            </thead>
            <tbody>
                <tr th:each="f : ${filas}"><td th:each="x : ${f.celdas()}" th:text="${x}">dato</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Una cochera de la playa: lineas pintadas, su numero y, si esta ocupada, el vehiculo -->
<a th:fragment="cochera(l)" th:href="@{/admin/playa/{n}(n=${l.numero()})}"
   th:class="'cochera ' + ${l.estado()}" th:title="${l.titulo()}" th:attr="aria-label=${l.titulo()}">
    <span class="cochera-numero" th:text="${l.numero()}">1</span>
    <span class="vehiculo" th:if="${l.ocupado()}"></span>
</a>
</body>
</html>
