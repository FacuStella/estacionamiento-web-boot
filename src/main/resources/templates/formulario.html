<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragmentos :: cabecera(${ent.titulo()})}"></head>
<body class="bg-light">
<nav th:replace="~{fragmentos :: barra}"></nav>
<main class="container pb-5" style="max-width: 640px"
      th:with="urlPaso=${editar} ? @{/admin/{e}/{c}/editar(e=${ent.id()},c=${clave})} : @{/admin/{e}/nuevo(e=${ent.id()})}">
    <h1 class="h3 mb-3" th:text="${editar} ? 'Editar ' + ${ent.singular()} + ' ' + ${clave} : ${ent.nuevo()}">Formulario</h1>
    <div th:replace="~{fragmentos :: avisos}"></div>

    <!-- Paso 1 (solo si un desplegable depende de otro campo): elegir ese campo, por ejemplo el tipo de vehiculo.
         Es un GET a esta misma pantalla, que vuelve con las opciones del paso 2 ya filtradas. -->
    <form th:if="${paso1}" method="get" class="card card-body shadow-sm" th:action="${urlPaso}">
        <p class="small text-muted">Paso 1 de 2</p>
        <div class="mb-3" th:each="c : ${campos}" th:if="${padres.contains(c.nombre())}">
            <label class="form-label" th:for="${c.nombre()}" th:text="${c.etiqueta()}">Etiqueta</label>
            <select class="form-select" th:id="${c.nombre()}" th:name="${c.nombre()}" required>
                <option value="" disabled th:selected="${valores.get(c.nombre()) == null or valores.get(c.nombre()) == ''}">Elegí una opción</option>
                <option th:each="o : ${opciones.get(c.nombre())}" th:value="${o.valor()}" th:text="${o.etiqueta()}"
                        th:selected="${o.valor() == valores.get(c.nombre())}">Opcion</option>
            </select>
        </div>
        <!-- lo que ya se habia cargado viaja oculto para no perderlo -->
        <th:block th:each="v : ${valores}">
            <input th:unless="${padres.contains(v.key) or v.value == null or v.value == ''}" type="hidden"
                   th:name="${v.key}" th:value="${v.value}">
        </th:block>
        <div class="d-flex gap-2 justify-content-end">
            <a class="btn btn-outline-secondary" th:href="@{/admin/{e}(e=${ent.id()})}">Cancelar</a>
            <button class="btn btn-primary">Continuar</button>
        </div>
    </form>

    <form th:unless="${paso1}" method="post" class="card card-body shadow-sm"
          th:action="${editar} ? @{/admin/{e}/{c}/actualizar(e=${ent.id()},c=${clave})} : @{/admin/{e}/guardar(e=${ent.id()})}">
        <p th:unless="${padres.isEmpty()}" class="small text-muted">Paso 2 de 2</p>

        <div class="mb-3" th:each="c : ${campos}">
            <!-- elegido en el paso 1: se muestra fijo, con un boton para volver a elegirlo -->
            <th:block th:if="${padres.contains(c.nombre())}">
                <span class="form-label d-block" th:text="${c.etiqueta()}">Etiqueta</span>
                <div class="d-flex align-items-center gap-2">
                    <strong th:text="${elegidos.get(c.nombre())}">Auto</strong>
                    <input type="hidden" th:name="${c.nombre()}" th:value="${valores.get(c.nombre())}">
                    <!-- vuelve al paso 1 llevando lo cargado (GET a esta pantalla, sin validar) -->
                    <button class="btn btn-link btn-sm p-0" name="cambiar" value="si" formmethod="get"
                            th:formaction="${urlPaso}" formnovalidate>Cambiar</button>
                </div>
            </th:block>

            <!-- texto, numero, contrasena -->
            <th:block th:if="${c.esInput()}">
                <label class="form-label" th:for="${c.nombre()}" th:text="${c.etiqueta()}">Etiqueta</label>
                <input class="form-control" th:id="${c.nombre()}" th:name="${c.nombre()}" th:type="${c.htmlType()}"
                       th:value="${c.htmlType() == 'password'} ? '' : ${valores.get(c.nombre())}"
                       th:attr="step=${c.tipo().name() == 'DECIMAL'} ? 'any' : null"
                       th:required="${c.obligatorio(editar)}"
                       th:readonly="${editar and (c.bloqueado() or c.soloCrear())}">
            </th:block>

            <!-- desplegable -->
            <th:block th:if="${c.esSelect() and !padres.contains(c.nombre())}">
                <label class="form-label" th:for="${c.nombre()}" th:text="${c.etiqueta()}">Etiqueta</label>
                <select class="form-select" th:id="${c.nombre()}" th:name="${c.nombre()}" th:required="${c.obligatorio(editar)}">
                    <option th:if="${c.vacio() != null}" value="" th:text="${c.vacio()}">Ninguno</option>
                    <option th:if="${c.vacio() == null}" value="" disabled
                            th:selected="${valores.get(c.nombre()) == null or valores.get(c.nombre()) == ''}">Elegí una opción</option>
                    <option th:each="o : ${opciones.get(c.nombre())}" th:value="${o.valor()}" th:text="${o.etiqueta()}"
                            th:selected="${o.valor() == valores.get(c.nombre())}">Opcion</option>
                </select>
            </th:block>

            <!-- casilla -->
            <div th:if="${c.esCheck()}" class="form-check">
                <input class="form-check-input" type="checkbox" th:id="${c.nombre()}" th:name="${c.nombre()}"
                       th:checked="${valores.get(c.nombre()) == 'true' or valores.get(c.nombre()) == 'on'}">
                <label class="form-check-label" th:for="${c.nombre()}" th:text="${c.etiqueta()}">Etiqueta</label>
            </div>
        </div>

        <div class="d-flex gap-2 justify-content-end">
            <a class="btn btn-outline-secondary" th:href="@{/admin/{e}(e=${ent.id()})}">Cancelar</a>
            <button class="btn btn-success">Guardar</button>
        </div>
    </form>
</main>
</body>
</html>
