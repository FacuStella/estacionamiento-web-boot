<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragmentos :: cabecera('Ingresar')}"></head>
<body class="bg-light">
<main class="container">
    <div class="row justify-content-center pt-5">
        <div class="col-11 col-sm-8 col-md-5 col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3">Estacionamiento</h1>
                    <p class="text-muted">Ingresá con tu usuario.</p>
                    <div th:if="${error != null}" class="alert alert-danger" role="alert" th:text="${error}"></div>
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Usuario</label>
                            <input id="username" name="username" class="form-control" autocomplete="username" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
                        </div>
                        <button class="btn btn-success w-100">Ingresar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
